name: Build Apple Silicon app

on:
  workflow_call:
    inputs:
      release-tag:
        description: Optional version tag, which must match Info.plist
        type: string
        default: ''
    outputs:
      artifact-name:
        description: Name of the uploaded ZIP and checksum artifact
        value: ${{ jobs.build.outputs.artifact-name }}

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # Match the local release toolchain; retain macOS 14 as the deployment target.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    outputs:
      artifact-name: ${{ steps.metadata.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check toolchain and architecture
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          test "$(xcodebuild -version)" = $'Xcode 26.6\nBuild version 17F113'
          test "$(xcrun --sdk macosx --show-sdk-version)" = 26.5
          swift --version
      - name: Validate version
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Resources/Info.plist)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Info.plist must contain a numeric major.minor.patch version' >&2
            exit 1
          fi
          if [[ ! "$build" =~ ^[1-9][0-9]*$ ]]; then
            echo 'Info.plist must contain a positive numeric build number' >&2
            exit 1
          fi
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'GitHub did not provide a full commit revision' >&2
            exit 1
          fi
          if [[ -n "$RELEASE_TAG" && "$RELEASE_TAG" != "v$version" ]]; then
            echo "Tag $RELEASE_TAG does not match Info.plist version $version" >&2
            exit 1
          fi
          revision=${GITHUB_SHA:0:12}
          echo "artifact-name=Piko-$version-build$build-$revision-arm64" >> "$GITHUB_OUTPUT"
      - name: Run tests
        run: |
          swift test
          swift test -c release
      - name: Test deterministic parser and session robustness with Address Sanitizer
        run: swift test --scratch-path .build-asan --sanitize address --filter robustness
      - name: Test native upload paths with Address Sanitizer
        run: swift test --scratch-path .build-upload-asan --sanitize address --filter 'UploadWireTests|SwiftUploadBackendTests|MTPUSBTests|UploadLocalSafetyTests|ActiveTransferCancellationTests|UploadTests|BinIntegrationTests|BinPreparationTests|MoveWireTests|DeleteWireTests|ShutdownTests|RangedDownloadTests|partialObject|RangedUploadTests|PartialUploadWireTests|PartialUploadTransportTests|finderPromiseCompletion|DeviceManagerTests|multipleDeviceDiagnostics|RemoteTransferTests|RemoteDropTableTests|PhotoThumbnail|ThumbnailWireTests|ThumbnailGenerationTests|RemoteFileGridTests|VideoThumbnailTests'
      - name: Package release configuration
        run: |
          zsh ./scripts/package.sh
      - name: Verify packaged app
        run: zsh ./scripts/verify-package.sh
      - name: Prepare versioned ZIP and checksum
        env:
          ARTIFACT_NAME: ${{ steps.metadata.outputs.artifact-name }}
        run: |
          mkdir -p dist/release
          cp dist/Piko.zip "dist/release/$ARTIFACT_NAME.zip"
          cd dist/release
          shasum -a 256 "$ARTIFACT_NAME.zip" > "$ARTIFACT_NAME.zip.sha256"
      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.metadata.outputs.artifact-name }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  compatibility:
    name: Launch packaged app on macOS 14
    needs: build
    runs-on: macos-14
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      ARTIFACT_NAME: ${{ needs.build.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and verify the release binary
        run: |
          test "$(sw_vers -productVersion | cut -d. -f1)" = 14
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir dist
          cd dist
          shasum -a 256 --check "$ARTIFACT_NAME.zip.sha256"
          mv "$ARTIFACT_NAME.zip" Piko.zip
      - name: Verify package on oldest supported macOS
        run: zsh scripts/verify-package.sh
      - name: Check app startup without attached devices
        run: |
          ditto -x -k dist/Piko.zip "$RUNNER_TEMP/piko-launch"
          python3 - "$RUNNER_TEMP/piko-launch/Piko.app/Contents/MacOS/Piko" <<'PYTHON'
          import subprocess, sys
          app = subprocess.Popen([sys.argv[1]])
          try:
              try:
                  code = app.wait(timeout=10)
              except subprocess.TimeoutExpired:
                  print('Piko remained running on macOS 14 for 10 seconds.')
              else:
                  raise SystemExit(f'Piko exited unexpectedly during startup: {code}')
          finally:
              if app.poll() is None:
                  app.terminate()
                  try:
                      app.wait(timeout=10)
                  except subprocess.TimeoutExpired:
                      app.kill()
                      app.wait()
          PYTHON
