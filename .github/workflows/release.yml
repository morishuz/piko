name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: github.repository == 'morishuz/piko' && (github.ref_type == 'tag' || github.ref == 'refs/heads/main')
    uses: ./.github/workflows/build.yml
    with:
      sign-release: true
      release-tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

    secrets:
      PIKO_CERTIFICATE_BASE64: ${{ secrets.PIKO_CERTIFICATE_BASE64 }}
      PIKO_CERTIFICATE_PASSWORD: ${{ secrets.PIKO_CERTIFICATE_PASSWORD }}
      PIKO_APPLE_ID: ${{ secrets.PIKO_APPLE_ID }}
      PIKO_APPLE_PASSWORD: ${{ secrets.PIKO_APPLE_PASSWORD }}
      PIKO_TEAM_ID: ${{ secrets.PIKO_TEAM_ID }}

  draft-release:
    # Manual runs only build artifacts; only a pushed version tag drafts a release.
    # The reusable build must succeed, including the macOS 14 compatibility job.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      ARTIFACT_NAME: ${{ needs.build.outputs.artifact-name }}
    steps:
      - name: Download verified build
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" --dir release
          cd release
          sha256sum --check "$ARTIFACT_NAME.zip.sha256"
          mv "$ARTIFACT_NAME.zip" Piko-macOS-arm64.zip
          sha256sum Piko-macOS-arm64.zip > Piko-macOS-arm64.zip.sha256
      - name: Create draft release
        run: |
          gh release create "$RELEASE_TAG" \
            "release/Piko-macOS-arm64.zip" "release/Piko-macOS-arm64.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease \
            --title "Piko $RELEASE_TAG Preview (Apple Silicon)" \
            --notes "Apple Silicon only; requires macOS 14 or newer. Developer ID signed and notarized by Apple; notarization ticket included. See the [user guide](https://github.com/$GITHUB_REPOSITORY/blob/$RELEASE_TAG/docs/USER_GUIDE.md) for installation, safe deletion, and diagnostics. Review this draft and add changes and known limitations before publishing."
